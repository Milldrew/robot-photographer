<mat-card>
  <mat-form-field appearance="fill">
    <mat-label>URL Link</mat-label>
    <input
      (keyup.enter)="createPhotos()"
      placeholder="https://example.com"
      matInput
      type="text"
      [(ngModel)]="url"
    />
    <button
      matSuffix
      mat-icon-button
      aria-label="Clear the URL"
      (click)="url = ''"
    >
      <mat-icon>close</mat-icon>
    </button>
  </mat-form-field>
  <mat-form-field appearance="fill">
    <mat-label>CSS Selector (optional)</mat-label>
    <input
      (keyup.enter)="createPhotos()"
      placeholder="#footer-id"
      matInput
      type="text"
      [(ngModel)]="elementSelector"
    />
    <button
      matSuffix
      mat-icon-button
      aria-label="Clear the selector"
      (click)="elementSelector = ''"
    >
      <mat-icon>close</mat-icon>
    </button>
  </mat-form-field>
  <div>
    <button (click)="createPhotos()" mat-raised-button color="primary" [disabled]="photoShootInProgress || !url.trim()">
      {{ photoShootInProgress ? 'Shooting…' : 'Shoot Photos' }}
    </button>
    <mat-progress-spinner
      *ngIf="photoShootInProgress"
      color="accent"
      mode="indeterminate"
      diameter="30"
    >
    </mat-progress-spinner>
  </div>
  <p class="hint" *ngIf="photoShootInProgress">Sixteen screen sizes in a real browser - a heavy page can take a minute.</p>
</mat-card>
